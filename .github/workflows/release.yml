name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    # Pin image to avoid surprise migration of ubuntu-latest → 26
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Let semantic-release inject the token into the git remote URL.
          # Persisted checkout credentials can interfere with notes pushes.
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        # version comes from package.json "packageManager" (pnpm@10.0.0)

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .github/nodejs.version
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Fetch git notes
        run: git fetch origin "+refs/notes/*:refs/notes/*" || true

      - name: Semantic Release
        env:
          # Prefer secret GH_TOKEN (PAT) so tag pushes can trigger other workflows
          # such as docker-build. GITHUB_TOKEN pushes do not start new workflows.
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          set +e
          pnpm release
          status=$?
          set -e
          if [ "${status}" -eq 0 ]; then
            exit 0
          fi

          # semantic-release order: prepare → tag → push(commit/tag) → pushNotes → publish.
          # A notes rejection leaves the tag on the remote but skips the GitHub Release.
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"

          if ! git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "semantic-release failed before tag ${tag} was pushed" >&2
            exit "${status}"
          fi

          echo "::warning::Repairing partial release ${tag} after notes/publish failure"

          git fetch origin --tags --force
          git fetch origin "+refs/notes/*:refs/notes/*" || true

          auth_url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          if ! git notes --ref "semantic-release-${tag}" show "${tag}" >/dev/null 2>&1; then
            git notes --ref "semantic-release-${tag}" add -f -m '{"channels":[null]}' "${tag}"
            git push "${auth_url}" "refs/notes/semantic-release-${tag}"
          fi

          release_api="https://api.github.com/repos/${GITHUB_REPOSITORY}/releases"
          if ! curl -fsS -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "${release_api}/tags/${tag}" >/dev/null; then
            body="$(awk -v ver="${version}" '
              BEGIN { keep=0 }
              $0 ~ "^# .*" ver {
                if (keep) exit
                keep=1
              }
              keep { print }
            ' CHANGELOG.md)"
            jq -n --arg tag "${tag}" --arg name "${tag}" --arg body "${body}" \
              '{tag_name:$tag, name:$name, body:$body, draft:false, prerelease:false}' \
              > /tmp/release.json
            curl -fsS -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/json" \
              --data @/tmp/release.json \
              "${release_api}" >/dev/null
            echo "Created GitHub Release ${tag}"
          fi
