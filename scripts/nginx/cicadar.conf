# cicadar（逆蝉）Next.js 反代
# 上游：docker-compose WEB_PORT 默认 127.0.0.1:3000
# 完整说明：scripts/nginx/README.md
#
# 安装:
#   sudo bash scripts/nginx/install.sh
#   sudo cp scripts/nginx/cicadar.conf /etc/nginx/sites-available/cicadar.conf
#   sudo ln -sfn /etc/nginx/sites-available/cicadar.conf /etc/nginx/sites-enabled/cicadar.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# HTTPS（二选一）:
#   泛域名（推荐，覆盖 *.cicadar.cn + 根域，自动续期；大陆加 --china）:
#     sudo bash scripts/nginx/enable-https-wildcard.sh --email you@example.com --china
#     然后取消下方 HTTPS server 注释
#   或按子域 HTTP-01（certbot，不签通配符）:
#     sudo bash scripts/nginx/enable-https.sh --email you@example.com
#   说明: scripts/nginx/README.md

upstream cicadar_web {
    server 127.0.0.1:3000;
    keepalive 32;
}

# ---------- HTTP ----------
server {
    listen 80;
    listen [::]:80;
    server_name cicadar.cn www.cicadar.cn;

    # Let's Encrypt 校验（certbot webroot 时可保留）
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        allow all;
    }

    # cicadar.cn / www.cicadar.cn 均反代到上游
    # 上 HTTPS 后可将整段 location 改为: return 301 https://$host$request_uri;
    location / {
        proxy_pass http://cicadar_web;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Next.js RSC / 流式响应
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        client_max_body_size 20m;
    }
}

