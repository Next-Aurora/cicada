# cicadar-api 反代
# 上游：cicadar-api 的 API_PORT 默认 127.0.0.1:8080
# 完整说明：scripts/nginx/README.md
#
# 安装（泛证书已覆盖 *.cicadar.cn，一般不用重签）:
#   sudo cp scripts/nginx/cicadar-api.conf /etc/nginx/sites-available/cicadar-api.conf
#   sudo ln -sfn /etc/nginx/sites-available/cicadar-api.conf /etc/nginx/sites-enabled/cicadar-api.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# DNS：api.cicadar.cn 的 A/AAAA 指向这台机器。
# 站点容器访问 API 仍用 http://host.docker.internal:8080，这样内部接口不经过这里。
#
# HTTPS：证书就绪后取消下方 HTTPS server 注释（与主站同一份 ssl-cicadar.cn.conf）。

upstream cicadar_api {
    server 127.0.0.1:8080;
    keepalive 16;
}

# ---------- HTTP ----------
server {
    listen 80;
    listen [::]:80;
    server_name api.cicadar.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        allow all;
    }

    # 登录读写的内部接口只给同机容器，不从公网进入。
    location ~* ^/internal(/|$) {
        return 404;
    }

    # 上 HTTPS 后可将整段 location 改为: return 301 https://$host$request_uri;
    location / {
        proxy_pass http://cicadar_api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        client_max_body_size 2m;
    }
}

